<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tableau de bord — Secrétariat</title>
        <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script defer src="script.js"></script>

        <script>
            function plur(n, singulier, pluriel) {
                return Math.abs(n) <= 1 ? singulier : (pluriel ?? singulier + 's');
            }

            document.addEventListener('alpine:init', () => {
                Alpine.store('donnees', {
                    nb_demandes_rdv_non_traites: 0,
                    nb_demandes_rdv_non_traites_gp: 0,
                    nb_demandes_rdv_non_traites_etu: 0,
                    nb_rdv_prog_semaine: 0,
                    nb_rdv_non_confirme_patients: 0,
                    nb_rdv_non_confirme_patients_gp:0,
                    nb_rdv_non_confirme_patients_etu:0
                })
            })
        </script>

        <link href="../assets/dashboard.css" rel="stylesheet" type="text/css" />
    </head>
    <body x-data>
        <header class="entete">
            <img class="entete-logo" src="../assets/logoCJ_blanc.png" alt="Clinique Juridique — Faculté de droit, Université Jean Moulin Lyon III">
            <div class="entete-titre">
                <h1>Tableau de bord</h1>
                <span class="entete-public">Secrétariat</span>
            </div>
            <img class="entete-illustration" src="../assets/facade_blanc.png" alt="" aria-hidden="true">
        </header>

        <main class="page">
            <section class="section">
                <h2 class="section-titre">Rendez-vous</h2>
                <div class="grille">
                    <div class="carte">
                        <div class="carte-haut">
                            <div class="indicateur">
                                <span class="indicateur-valeur" x-text="$store.donnees.nb_demandes_rdv_non_traites"></span>
                                <span class="indicateur-libelle" x-text="plur($store.donnees.nb_demandes_rdv_non_traites, 'demande de RDV non traitée', 'demandes de RDV non traitées')"></span>
                            </div>
                            <img class="carte-illustration" src="../assets/undraw_accept-request_489a.svg" alt="" aria-hidden="true">
                        </div>
                        <ul class="details">
                            <li><strong x-text="$store.donnees.nb_demandes_rdv_non_traites_etu"></strong> <span x-text="plur($store.donnees.nb_demandes_rdv_non_traites_etu, 'RDV étudiant', 'RDV étudiants')"></span></li>
                            <li><strong x-text="$store.donnees.nb_demandes_rdv_non_traites_gp"></strong> RDV grand public</li>
                        </ul>
                    </div>

                    <div class="carte">
                        <div class="carte-haut">
                            <div class="indicateur">
                                <span class="indicateur-valeur" x-text="$store.donnees.nb_rdv_prog_semaine"></span>
                                <span class="indicateur-libelle" x-text="plur($store.donnees.nb_rdv_prog_semaine, 'RDV programmé cette semaine', 'RDV programmés cette semaine')"></span>
                            </div>
                            <img class="carte-illustration" src="../assets/undraw_online-calendar_iz1q.svg" alt="" aria-hidden="true">
                        </div>
                    </div>

                    <div class="carte">
                        <div class="carte-haut">
                            <div class="indicateur">
                                <span class="indicateur-valeur" x-text="$store.donnees.nb_rdv_non_confirme_patients"></span>
                                <span class="indicateur-libelle">RDV en attente de confirmation patient</span>
                            </div>
                            <img class="carte-illustration" src="../assets/undraw_progress-bar_o44f.svg" alt="" aria-hidden="true">
                        </div>
                        <ul class="details">
                            <li><strong x-text="$store.donnees.nb_rdv_non_confirme_patients_etu"></strong> <span x-text="plur($store.donnees.nb_rdv_non_confirme_patients_etu, 'RDV étudiant', 'RDV étudiants')"></span></li>
                            <li><strong x-text="$store.donnees.nb_rdv_non_confirme_patients_gp"></strong> RDV grand public</li>
                        </ul>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
