<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script defer src="script.js"></script>

        <script>
            function plur(n, singulier, pluriel) {
                return Math.abs(n) <= 1 ? singulier : (pluriel ?? singulier + 's');
            }

            document.addEventListener('alpine:init', () => {
                Alpine.store('donnees', {
                    nb_demandes_rdv_non_traites: 0,
                    nb_demandes_rdv_non_traites_gp: 0,
                    nb_demandes_rdv_non_traites_etu: 0,
                    nb_rdv_prog_semaine: 0,
                    nb_rdv_non_confirme_patients: 0,
                    nb_rdv_non_confirme_patients_gp:0,
                    nb_rdv_non_confirme_patients_etu:0
                })
            })
        </script>

        <link href="../assets/dashboard.css" rel="stylesheet" type="text/css" />
    </head>
    <body x-data>
        <div class="page">
            <img class="logo" src="../../fiche_clinicien/logoCJ.png" alt="Logo Clinique juridique" width="180"/>
            <div class="entete">
                <h1 class="titre">Tableau de bord Clinique juridique</h1>
                <h2 class="sous-titre">Secrétariat</h2>
            </div>
            <div class="grille-cartes">
                    <div class="carte">
                        <div class="carte-principal">
                            <img src="../assets/undraw_accept-request_489a.svg" class="illustration" alt="" width="160" height="160"/>
                            <div class="chiffre-bloc"><span class="chiffre-rouge" x-text="$store.donnees.nb_demandes_rdv_non_traites"></span> <span class="libelle" x-text="plur($store.donnees.nb_demandes_rdv_non_traites, 'demande de RDV non traitée', 'demandes de RDV non traitées')"></span></div>
                        </div>
                        <div class="details">
                            <div><span class="rouge" x-text="$store.donnees.nb_demandes_rdv_non_traites_etu"></span> <span x-text="plur($store.donnees.nb_demandes_rdv_non_traites_etu, 'RDV étudiant', 'RDV étudiants')"></span></div>
                            <div><span class="rouge" x-text="$store.donnees.nb_demandes_rdv_non_traites_gp"></span> <span>RDV grand public</span></div>
                        </div>
                    </div>

                    <div class="carte">
                        <div class="carte-principal">
                            <img src="../assets/undraw_online-calendar_iz1q.svg" class="illustration" alt="" width="160" height="160"/>
                            <div class="chiffre-bloc"><span class="chiffre-rouge" x-text="$store.donnees.nb_rdv_prog_semaine"></span> <span class="libelle" x-text="plur($store.donnees.nb_rdv_prog_semaine, 'RDV programmé cette semaine', 'RDV programmés cette semaine')"></span></div>
                        </div>
                    </div>

                    <div class="carte">
                        <div class="carte-principal">
                            <img src="../assets/undraw_progress-bar_o44f.svg" class="illustration" alt="" width="160" height="160"/>
                            <div class="chiffre-bloc"><span class="chiffre-rouge" x-text="$store.donnees.nb_rdv_non_confirme_patients"></span> <span class="libelle">RDV en attente de confirmation patient</span></div>
                        </div>
                        <div class="details">
                            <div><span class="rouge" x-text="$store.donnees.nb_rdv_non_confirme_patients_etu"></span> <span x-text="plur($store.donnees.nb_rdv_non_confirme_patients_etu, 'RDV étudiant', 'RDV étudiants')"></span></div>
                            <div><span class="rouge" x-text="$store.donnees.nb_rdv_non_confirme_patients_gp"></span> <span>RDV grand public</span></div>
                        </div>
                    </div>
            </div>
        </div>
    </body>
</html>
