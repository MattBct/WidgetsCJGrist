<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        [data-theme="light"], :root:not([data-theme="dark"]) {
            --pico-primary-background: #c03737;
}
    </style>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        function plur(n, singulier, pluriel) {
            return Math.abs(n) <= 1 ? singulier : (pluriel ?? singulier + 's');
        }

        // Décompose une valeur décimale d'heures (ex : 2.25) en heures et minutes (2 h 15)
        function decomposeHeures(valeur) {
            const total_minutes = Math.round((Number(valeur) || 0) * 60);
            const minutes_absolues = Math.abs(total_minutes);

            return {
                signe: total_minutes < 0 ? -1 : 1,
                heures: Math.floor(minutes_absolues / 60),
                minutes: minutes_absolues % 60
            };
        }

        function heuresPart(valeur) {
            return decomposeHeures(valeur).heures;
        }

        function minutesPart(valeur) {
            return decomposeHeures(valeur).minutes;
        }

        // Format compact pour les badges : "2 h", "2 h 15", "45 min"
        function formatHeuresCourt(valeur) {
            const { signe, heures, minutes } = decomposeHeures(valeur);
            const prefixe = signe < 0 ? '- ' : '';

            if (heures === 0 && minutes > 0) {
                return prefixe + minutes + ' min';
            }

            return prefixe + heures + ' h' + (minutes > 0 ? ' ' + String(minutes).padStart(2, '0') : '');
        }

        // Format texte : "1 heure", "2 heures 15", "45 minutes"
        function formatHeuresLong(valeur) {
            const { signe, heures, minutes } = decomposeHeures(valeur);
            const prefixe = signe < 0 ? '- ' : '';

            if (heures === 0 && minutes > 0) {
                return prefixe + minutes + ' ' + plur(minutes, 'minute', 'minutes');
            }

            return prefixe + heures + ' ' + plur(heures, 'heure', 'heures') + (minutes > 0 ? ' ' + String(minutes).padStart(2, '0') : '');
        }

        // Format date : "12/03/2026" (fuseau de Paris, pour les colonnes Date comme DateTime)
        function formatDate(valeur) {
            if (valeur == null) {
                return '';
            }

            return new Date(valeur * 1000).toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris' });
        }

        document.addEventListener('alpine:init', () => {
            Alpine.store('clinicien', {
                label_prenom_nom: "",
                label_formation: "",
                option: false,
                heures_totales: 0,
                heures_rdv: 0,
                heures_projets: 0,
                heures_regulations: 0,
                heures_regul_credit: 0,
                heures_regul_debit: 0,
                heures_regul_net: 0,
                nb_rdv: 0,
                nb_rdv_termines: 0,
                nb_apprec_peu_satisfaisant: 0,
                nb_apprec_satisfaisant: 0,
                nb_apprec_tres_satisfaisant: 0,
                nb_projets: 0,
                rdv: [],
                projets: [],
                regulations: [],
                nb_permanences: 0,
                heures_permanences: 0,
                permanences: []
            })

            const store = Alpine.store('clinicien')

            const chartRepartition = new Chart(document.getElementById('chart-repartitions'), {
                type: 'pie',
                data: {
                    labels: ['Rendez-vous', 'Projets', 'Régulations individuelles', 'Permanences'],
                    datasets: [{
                        label: 'Données Grist',
                        data: [store.heures_rdv, store.heures_projets, store.heures_regul_net, store.heures_permanences],
                        backgroundColor: ['#A73030', '#772222', '#471414', '#C03737',],
                        hoverOffset: 4
                    }]
                },
                options: {
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: (context) => ' ' + formatHeuresCourt(context.parsed)
                            }
                        }
                    }
                }
            })

            Alpine.effect(() => {
                chartRepartition.data.datasets[0].data = [
                    store.heures_rdv,
                    store.heures_projets,
                    store.heures_regul_net,
                    store.heures_permanences
                ]
                chartRepartition.update()
            })
        })
    </script>
</head>

<body x-data style="width: 100%;">
    <header>
        <div class="container">
            <img src="logoCJ.png" alt="Logo Clinique" style="width: 200px; margin:auto ; margin-bottom:20px; height: auto; display: block;">

            <div>
                <h1 style="text-align: center;" x-text="$store.clinicien.label_prenom_nom"></h1>
                <div style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 15px;">
                    <span class="badge clinique" style="font-weight:700;" x-text="$store.clinicien.label_formation"></span>
                    <span class="badge info" x-show="$store.clinicien.option">Option clinique</span>
                </div>
            </div>

            <div style="margin-top:60px; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: start; gap: 2em; row-gap: 2em;">
                <div style="display: flex; justify-content:left; flex-direction: column; align-items: center; gap: 10px;">
                    <span style="font-size: 4.5em; font-weight:900; color:#c03737; line-height:1" x-text="heuresPart($store.clinicien.heures_totales)"></span>
                    <span style="font-size: 1.5em; font-weight:600; color:black; margin-top:-15px" x-text="plur(heuresPart($store.clinicien.heures_totales), 'heure', 'heures')"></span>
                    <span style="font-size: 0.75em; margin-top: -10px" x-show="minutesPart($store.clinicien.heures_totales) > 0">et <strong style="color:#c03737"><span x-text="minutesPart($store.clinicien.heures_totales)"></span> <span x-text="plur(minutesPart($store.clinicien.heures_totales), 'minute', 'minutes')"></span></strong></span>
                </div>

                <div style="display: flex; justify-content:center; flex-direction: column; align-items: center; gap: 10px;">
                    <span style="font-size: 4.5em; font-weight:900; color:#c03737; line-height:1" x-text="$store.clinicien.nb_rdv"></span>
                    <span style="font-size: 1.5em; font-weight:600; color:black; margin-top:-15px">RDV</span>
                    <span style="font-size: 0.75em; margin-top: -10px">dont <strong style="color:#c03737"><span x-text="$store.clinicien.nb_rdv_termines"></span> <span x-text="plur($store.clinicien.nb_rdv_termines, 'RDV terminé', 'RDV terminés')"></span></strong></span>
                    <span style="font-size: 0.75em; margin-top: -10px"><strong style="color:#c03737"><span x-text="$store.clinicien.nb_apprec_peu_satisfaisant"></span> <span x-text="plur($store.clinicien.nb_apprec_peu_satisfaisant, 'appréciation peu satisfaisante', 'appréciations peu satisfaisantes')"></span></strong></span>
                    <span style="font-size: 0.75em; margin-top: -10px"><strong style="color:#c03737"><span x-text="$store.clinicien.nb_apprec_satisfaisant"></span> <span x-text="plur($store.clinicien.nb_apprec_satisfaisant, 'appréciation satisfaisante', 'appréciations satisfaisantes')"></span></strong></span>
                    <span style="font-size: 0.75em; margin-top: -10px"><strong style="color:#c03737"><span x-text="$store.clinicien.nb_apprec_tres_satisfaisant"></span> <span x-text="plur($store.clinicien.nb_apprec_tres_satisfaisant, 'appréciation très satisfaisante', 'appréciations très satisfaisantes')"></span></strong></span>
                </div>
                <div style="display: flex; justify-content:left; flex-direction: column; align-items: center; gap: 10px;">
                    <span style="font-size: 4.5em; font-weight:900; color:#c03737; line-height:1" x-text="$store.clinicien.nb_projets"></span>
                    <span style="font-size: 1.5em; font-weight:600; color:black; margin-top:-15px" x-text="plur($store.clinicien.nb_projets, 'projet', 'projets')"></span>
                </div>

                <div style="display: flex; justify-content:left; flex-direction: column; align-items: center; gap: 10px;">
                    <span style="font-size: 4.5em; font-weight:900; color:#c03737; line-height:1" x-text="$store.clinicien.nb_permanences"></span>
                    <span style="font-size: 1.5em; font-weight:600; color:black; margin-top:-15px" x-text="plur($store.clinicien.nb_permanences, 'permanence', 'permanences')"></span>
                </div>

                <div x-show='$store.clinicien.heures_regul_credit > 0 || Math.abs($store.clinicien.heures_regul_debit) > 0' >
                    <div style="display: flex; justify-content:left; flex-direction: column; align-items: center; padding:10px 20px; background-color:#f2f2f2; border-radius: 10px; gap: 10px;">
                        <span style="font-size: 1em; font-weight:600; color:#c03737;">Régulations individuelles</span>
                        <span>+ <span x-text="formatHeuresLong($store.clinicien.heures_regul_credit)"></span></span>
                        <span>- <span x-text="formatHeuresLong(Math.abs($store.clinicien.heures_regul_debit))"></span></span>
                    </div>
                    
                </div>
            </div>

            <div style="margin-top:4em ; display: flex; flex-direction: row; flex-wrap: wrap; width:100% ; gap: 2em; align-items: center; justify-content: center;">
                <div style="flex: 3; min-width: 250px;">
                    <span>
                        <span style="color:#C03737; font-size: 1.00em; font-weight:750;"><span x-text="Math.round($store.clinicien.heures_totales/60*100)"></span> %</span><span style="font-size: 0.8em ; color:rgb(114, 114, 114); font-weight:300"> des heures complétées</span>
                    </span>
                    <progress :value="Math.round($store.clinicien.heures_totales/60*100)" max="100" style="color: #c03737;"/>
                </div>

                <div style="flex: 1; min-width: 200px; max-width: 100%;">
                    <canvas id="chart-repartitions"></canvas>
                </div>

            </div>
        </div>


    </header>

    <main style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;">
        <div class="container main-bloc">
                <h3>Rendez-vous</h3>
                <div style="padding:0px 15px; display:flex; flex-direction: column; gap: 10px;">
                    
                    <template x-for="rdv in $store.clinicien.rdv">
                        <div class="badge gris-clair">
                            <div style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;">
                                <div style="display: flex; flex-direction: column; justify-content: start; gap: 2px; min-width: 0;">
                                    <span><strong x-text="rdv.id_rdv_clinique"></strong></span></span>

                                    <!--Encart informations supplemémentaires-->
                                    <div style="display: flex; flex-direction: row; gap: 4px; font-weight: lighter; flex-wrap: wrap; font-size: xx-small;">
                                        <span x-text="rdv.statut_rdv" style="font-weight: bold;"></span><span x-text="rdv.motif ?? Pas de motif indiqué"></span><span x-show="rdv.creneau_rdv_1 != null && rdv.creneau_rdv_2 != null"><span x-text="new Date(rdv.creneau_rdv_1 * 1000).toLocaleString('fr-FR')"></span> et <span x-text="new Date(rdv.creneau_rdv_2 * 1000).toLocaleString('fr-FR')"></span></span>
                                    </div>
                                </div>
                                <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
                                    <span class="badge" :class="rdv.statut_rdv=='Terminé' ? 'success':'gris-fonce'" style="font-weight:bold; text-wrap:nowrap" x-text="formatHeuresCourt(rdv.heures_defaut)"></span>
                                </div>
                            </div>

                        </div>
                    </template>
                </div>
        </div>

        <div class="container main-bloc">
            <h3>Projets</h3>
            <div style="padding:0px 15px; display:flex; flex-direction: column; gap: 10px;">
                <template x-for="projet in $store.clinicien.projets">
                    <div class="badge gris-clair">
                        <div style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;">
                            <span x-text="projet.nom_projet" style="min-width: 0; overflow-wrap: break-word;"></span>
                            <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
                                <!--<span class="badge" style="background-color:#FEFEFE; color:black">En cours</span>-->
                                <span class="badge" :class="projet.statut=='Terminé' ? 'success':'gris-fonce'" style="font-weight:bold" x-text="formatHeuresCourt(projet.heures)"></span>
                            </div>
                        </div>
                    </div>
                </template>
                
            </div>
        </div>

        <div class="container main-bloc">
            <h3>Régulations individuelles</h3>
            <div style="padding:0px 15px; display:flex; flex-direction: column; gap: 10px;">
                <template x-for="regul in $store.clinicien.regulations">
                    <div class="badge gris-clair">
                        <div style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;">
                            <span x-text="regul.motif" style="min-width: 0; overflow-wrap: break-word;"></span>
                            <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
                                <span class="badge" :class="regul.heures > 0 ? 'success' : 'fail'" style="font-weight:bold" x-text="formatHeuresCourt(regul.heures)"></span>
                            </div>
                        </div>
                    </div>
                </template>

            </div>

        </div>

        <div class="container main-bloc">
            <h3>Permanences</h3>
            <div style="padding:0px 15px; display:flex; flex-direction: column; gap: 10px;">
                <template x-for="permanence in $store.clinicien.permanences">
                    <div class="badge gris-clair">
                        <div style="display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;">
                            <div style="display: flex; flex-direction: column; justify-content: start; gap: 2px; min-width: 0;">
                                <span><strong x-text="formatDate(permanence.date)"></strong></span>

                                <!--Encart informations supplemémentaires-->
                                <div style="display: flex; flex-direction: row; gap: 4px; font-weight: lighter; flex-wrap: wrap; font-size: xx-small;" x-show="permanence.commentaires">
                                    <span x-text="permanence.commentaires" style="overflow-wrap: break-word;"></span>
                                </div>
                            </div>
                            <div style="display: flex; flex-direction: row; gap: 10px; align-items: center;">
                                <span class="badge gris-fonce" style="font-weight:bold; text-wrap:nowrap" x-text="formatHeuresCourt(permanence.heures)"></span>
                            </div>
                        </div>
                    </div>
                </template>

            </div>

        </div>
    </main>
    
    <script defer src="script.js"></script>

</body>

<style>
    .main-bloc {
        padding: 20px; 
        padding-top:5px;
        background-color:#F6DFDF; 
        border-radius: 10px; 
        margin-top: 20px;
    }

    .badge {
        padding: 10px; 
        border-radius: 10px;
        max-width: 100%;
        overflow-wrap: break-word;
        word-break: break-word;
    }

    .clinique {
        background-color: #C03737;
        color: white;
    }

    .info {
        background-color: #F6DFDF;
        color: #000;
    }

    .gris-clair {
        background-color: #f2f2f2;
    }

    .gris-fonce {
        background-color: #c8c8c8;
    }

    .success {
        background-color: #aef6be;
        color: #155724;
    }

    .fail {
        background-color: #f8d7da;
        color: #721c24;
    }

    .main-bloc > h3 {
        margin-bottom: 20px;
        margin-top: 10px;
    }
</style>

</html>
