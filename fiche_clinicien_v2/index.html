<!DOCTYPE html>
<html lang="fr">
  <!-- Widget Grist : fiche bilan d'un clinicien (RDV, permanences, projets, appréciations), tenant sur une feuille A4 portrait.
  Ne lit que des colonnes de la table Cliniciens (listes en JSON via des colonnes formules : voir README.md).
  Ouvrir index.html?demo (ou hors de Grist) pour un aperçu avec des données fictives.
  Matthieu Bouchet - Oct. 2026
  -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fiche clinicien</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link rel="stylesheet" href="main.css">
  </head>

  <body>
    <nav class="barre-outils no-print">
      <div class="choix" id="choix-clinicien" hidden>
        <label class="choix-label" for="clinicien" id="label-clinicien">Clinicien</label>
        <button type="button" class="btn-icone" id="precedent" title="Clinicien précédent" aria-label="Clinicien précédent">‹</button>
        <select id="clinicien"></select>
        <button type="button" class="btn-icone" id="suivant" title="Clinicien suivant" aria-label="Clinicien suivant">›</button>
      </div>
      <span class="etat-echelle" id="etat-echelle"></span>
      <div class="barre-actions">
        <button type="button" class="btn btn-secondaire" id="imprimer-tout" hidden>Imprimer tout</button>
        <button type="button" class="btn btn-principal" id="imprimer" title="Dans la fenêtre d'impression, choisir « Enregistrer au format PDF »" disabled>Imprimer / PDF</button>
      </div>
    </nav>

    <div class="bandeau-message alerte no-print" id="message" hidden></div>

    <!-- Aperçu à l'écran = rendu imprimé (réduit à la largeur du panneau si besoin) -->
    <div class="apercu" id="apercu">
      <div class="cadre" id="cadre"></div>
    </div>

    <!-- Fiches de tous les cliniciens de la vue, construites uniquement le temps de l'impression -->
    <div id="lot" class="lot"></div>

    <script src="script.js"></script>
  </body>
</html>
